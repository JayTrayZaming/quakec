name: Compile QuakeC
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  Compile-QC:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Rewind to Oct 31 & Apply Your Edits
        run: |
          git config user.email "builder@local"
          git config user.name "Builder"
          COMMITS=$(git log --author="JayTrayZaming" --reverse --format="%H" -- source/)
          git checkout $(git rev-list -n 1 --before="2026-10-31 19:00:00" main)
          git cherry-pick --allow-empty $COMMITS
      - name: Compile SSQC
        run: |
          chmod +x bin/fteqcc-cli-lin
          python3 bin/qc_hash_generator.py -i tools/asset_conversion_table.csv -o source/server/hash_table.qc
          mkdir -p build/standard
          bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/ssqc.src -o build/standard/progs.dat
      - name: Zip Progs
        run: |
          cd build
          zip -r -j standard-nzp-qc.zip standard/*
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: standard-nzp-qc
          path: build/standard-nzp-qc.zip
          if-no-files-found: error
