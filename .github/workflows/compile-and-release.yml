name: Compile QuakeC
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  Compile-QC:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nzp-team/toolbox:main
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Checkout Fork Code
        uses: actions/checkout@v4
        with:
          path: fork_code
      - name: Copy Fork Code
        run: cp -rf fork_code/. /workspace/repos/quakec/
      - name: Compile
        run: /entrypoint.sh build-quakec
      - name: Zip Progs
        run: |
          cd /workspace/repos/quakec/build
          zip -r -j standard-nzp-qc.zip standard/*
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: standard-nzp-qc
          path: /workspace/repos/quakec/build/standard-nzp-qc.zip
          if-no-files-found: error
          
