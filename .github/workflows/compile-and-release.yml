name: Compile QuakeC
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  Compile-QC:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nzp-team/toolbox:main
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Checkout Fork Code
        uses: actions/checkout@v4
        with:
          path: fork_code
          fetch-depth: 10
      - name: Rewind to Oct 31 & Apply Your 3 Edits
        run: |
          cd /workspace/repos/quakec
          git checkout $(git rev-list -n 1 --before="2026-10-31 19:00:00" main)
          git fetch "$GITHUB_WORKSPACE/fork_code" main
          git config user.email "builder@local"
          git config user.name "Builder"
          git cherry-pick 6894cb4 25da0b3 0ebc179
      - name: Compile
        run: /entrypoint.sh build-quakec
      - name: Zip Progs
        run: |
          cd /workspace/repos/quakec/build
          zip -r -j standard-nzp-qc.zip standard/*
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: standard-nzp-qc
          path: /workspace/repos/quakec/build/standard-nzp-qc.zip
          if-no-files-found: error
