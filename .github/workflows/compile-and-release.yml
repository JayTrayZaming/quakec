name: Compile QuakeC
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  Compile-QC:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nzp-team/toolbox:main
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Checkout Fork Code
        uses: actions/checkout@v4
        with:
          path: fork_code
      - name: Rewind to Oct 31 PS3 Build & Copy Edits
        run: |
          cd /workspace/repos/quakec
          git checkout $(git rev-list -n 1 --before="2026-10-31 19:00:00" main)
          cp -f "$GITHUB_WORKSPACE/fork_code/source/server/main.qc" source/server/main.qc
          cp -f "$GITHUB_WORKSPACE/fork_code/source/server/player/player_core.qc" source/server/player/player_core.qc
          cp -f "$GITHUB_WORKSPACE/fork_code/source/server/weapons/weapon_core.qc" source/server/weapons/weapon_core.qc
      - name: Compile
        run: /entrypoint.sh build-quakec
      - name: Zip Progs
        run: |
          cd /workspace/repos/quakec/build
          zip -r -j standard-nzp-qc.zip standard/*
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: standard-nzp-qc
          path: /workspace/repos/quakec/build/standard-nzp-qc.zip
          if-no-files-found: error
          
